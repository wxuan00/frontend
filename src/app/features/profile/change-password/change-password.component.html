<div class="page-container">
  <div class="page-header">
    <div>
      <h1>Change Password</h1>
      <div class="breadcrumb">Account › Profile › Change Password</div>
    </div>
  </div>

  <div class="card">
    <div class="card-header">
      <h3>🔒 Update Your Password</h3>
    </div>
    <form (ngSubmit)="onSubmit()">
      <div class="form-grid">
        <div class="form-group full-width">
          <label>Current Password</label>
          <input type="password" class="form-control" [(ngModel)]="currentPassword" name="currentPassword" placeholder="Enter current password" required>
        </div>

        <div class="form-group">
          <label>New Password</label>
          <input type="password" class="form-control" [(ngModel)]="newPassword" name="newPassword" placeholder="Enter new password" required>
        </div>

        <div class="form-group">
          <label>Confirm New Password</label>
          <input type="password" class="form-control" [(ngModel)]="confirmPassword" name="confirmPassword" placeholder="Re-enter new password" required>
        </div>
      </div>

      <div class="form-actions">
        <button type="button" (click)="cancel()" class="btn btn-secondary">Cancel</button>
        <button type="submit" class="btn btn-primary">Change Password</button>
      </div>
    </form>

    <p *ngIf="message" class="success-msg">✅ {{ message }}</p>
    <p *ngIf="errorMessage" class="error-msg">⚠️ {{ errorMessage }}</p>
  </div>
</div>
