<div class="page-container">
  <div class="page-header">
    <div>
      <h1>{{ isEditMode ? 'Edit Merchant' : 'Create Merchant' }}</h1>
      <div class="breadcrumb">
        <a routerLink="/merchants">Inquiries › Merchants</a> › {{ isEditMode ? 'Edit #' + merchantId : 'New' }}
      </div>
    </div>
    <a routerLink="/merchants" class="btn btn-secondary">← Back to Merchants</a>
  </div>

  <!-- Form -->
  <div class="card" style="max-width:700px;">
    <div class="card-header">
      <h3>{{ isEditMode ? 'Update Merchant Information' : 'New Merchant Details' }}</h3>
    </div>
    <form (ngSubmit)="onSubmit()">
      <div class="form-grid">
        <div class="form-group">
          <label>Business Name *</label>
          <input type="text" class="form-control" [(ngModel)]="formData.businessName" name="businessName" placeholder="Enter business name" required>
        </div>

        <div class="form-group">
          <label>Registration Number</label>
          <input type="text" class="form-control" [(ngModel)]="formData.businessRegistrationNumber" name="businessRegistrationNumber" placeholder="e.g. 202312345A">
        </div>

        <div class="form-group">
          <label>Email Address</label>
          <input type="email" class="form-control" [(ngModel)]="formData.email" name="email" placeholder="merchant@example.com">
        </div>

        <div class="form-group">
          <label>Phone Number</label>
          <input type="tel" class="form-control" [(ngModel)]="formData.phoneNumber" name="phoneNumber" placeholder="+60 12-345 6789">
        </div>

        <div class="form-group">
          <label>Status</label>
          <select class="form-control" [(ngModel)]="formData.status" name="status">
            <option value="ACTIVE">Active</option>
            <option value="PENDING">Pending</option>
            <option value="SUSPENDED">Suspended</option>
          </select>
        </div>

        <div class="form-group full-width">
          <label>Address</label>
          <textarea class="form-control" [(ngModel)]="formData.address" name="address" placeholder="Enter business address" rows="3"></textarea>
        </div>
      </div>

      <div class="form-actions">
        <button type="button" (click)="cancel()" class="btn btn-secondary">Cancel</button>
        <button type="submit" class="btn btn-primary">{{ isEditMode ? 'Save Changes' : 'Create Merchant' }}</button>
      </div>
    </form>

    <p *ngIf="message" class="success-msg">✅ {{ message }}</p>
    <p *ngIf="errorMessage" class="error-msg">⚠️ {{ errorMessage }}</p>
  </div>
</div>
