<div class="page-container">
  <!-- Page Header -->
  <div class="page-header">
    <div>
      <h1>Role Management</h1>
      <div class="breadcrumb">Administration › Roles</div>
    </div>
    <button (click)="toggleForm()" class="btn btn-primary">
      {{ showForm ? '✕ Cancel' : '+ Add Role' }}
    </button>
  </div>

  <!-- Success/Error Messages -->
  <p *ngIf="message" class="success-msg">✅ {{ message }}</p>
  <p *ngIf="errorMessage" class="error-msg">⚠️ {{ errorMessage }}</p>

  <!-- Create/Edit Role Form -->
  @if (showForm) {
    <div class="card" style="max-width:560px;">
      <div class="card-header">
        <h3>{{ editMode ? 'Edit Role' : 'Create New Role' }}</h3>
      </div>
      <form (ngSubmit)="saveRole()">
        <div class="form-group">
          <label>Role Name</label>
          <input type="text" class="form-control" [(ngModel)]="formData.name" name="name" placeholder="e.g., ADMIN, MERCHANT, VIEWER" required>
        </div>

        <div class="form-group">
          <label>Description</label>
          <input type="text" class="form-control" [(ngModel)]="formData.description" name="description" placeholder="What this role can do...">
        </div>

        <div class="form-actions">
          <button type="button" (click)="toggleForm()" class="btn btn-secondary">Cancel</button>
          <button type="submit" class="btn btn-success">{{ editMode ? 'Update' : 'Create' }}</button>
        </div>
      </form>
    </div>
  }

  <!-- Roles Table -->
  <div class="card">
    <div class="card-header">
      <h3>System Roles ({{ roles.length }})</h3>
    </div>
    <table class="data-table">
      <thead>
        <tr>
          <th>ID</th>
          <th>Name</th>
          <th>Description</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let role of roles">
          <td class="id-cell">#{{ role.id }}</td>
          <td><span class="badge badge-primary">{{ role.name }}</span></td>
          <td>{{ role.description || '-' }}</td>
          <td>
            <div class="action-btns">
              <button (click)="startEdit(role)" class="btn btn-sm btn-outline">Edit</button>
              <button (click)="deleteRole(role.id)" class="btn btn-sm btn-danger">Delete</button>
            </div>
          </td>
        </tr>
      </tbody>
    </table>

    <div *ngIf="roles.length === 0" class="no-data">
      No roles defined yet.
    </div>
  </div>
</div>
